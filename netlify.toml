# Publicação na Netlify (plano gratuito permite uso comercial).
# O adaptador oficial de Next.js da Netlify é aplicado automaticamente.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Service worker do PWA: o navegador precisa sempre da versão mais nova
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
