name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Banco, build e tipos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Valores fictícios: o build não acessa o Supabase
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testar regras do banco (migrations + RLS + fluxo do Anexo I)
        run: npm run db:test

      - name: Testes unitários
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Checagem de tipos
        run: npm run typecheck

  e2e:
    name: Ponta a ponta (Supabase local + navegador)
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Subir Supabase local (migrations, seed, hook de perfil, e-mails)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Exportar URL e chaves do Supabase local
        run: |
          npx supabase status -o env > /tmp/supabase.env
          set -a; . /tmp/supabase.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"
          echo "Variáveis disponíveis:"; cut -d= -f1 /tmp/supabase.env

      - name: Criar usuários de teste (escola, DRE, Gestão Estadual)
        run: npm run dev:usuarios

      - name: Conferir login e perfil no token
        run: npm run dev:verificar

      - name: Build de produção
        run: npm run build

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Testes ponta a ponta
        run: npm run test:e2e

      - name: Diagnóstico do Realtime
        if: failure()
        run: |
          docker exec supabase_db_vigilia-escolar psql -U postgres -c "select pubname, schemaname, tablename from pg_publication_tables;" || true
          docker logs --tail 40 supabase_realtime_vigilia-escolar 2>&1 | tail -40 || true

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
